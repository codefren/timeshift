# =============================================================================
#  Enrutador de TimeShiftZone.
#
#  Cada backend tiene su PROPIA base de datos, así que no son intercambiables:
#  esto enruta de forma determinista, NO balancea. Un round-robin entre los
#  tres devolvería datos de una base distinta en cada petición.
#
#    :8001            -> backend-1  (timeshift_1)
#    :8002            -> backend-2  (timeshift_2)
#    :8003            -> backend-3  (timeshift_3)
#    :80  t1.localhost-> backend-1     (publicado como :8000 en el host)
#         t2.localhost-> backend-2
#         t3.localhost-> backend-3
# =============================================================================

# Las cabeceras de proxy comunes viven en proxy_common.inc (montado al lado).
upstream backend_1 { server backend-1:8000 max_fails=3 fail_timeout=15s; keepalive 16; }
upstream backend_2 { server backend-2:8000 max_fails=3 fail_timeout=15s; keepalive 16; }
upstream backend_3 { server backend-3:8000 max_fails=3 fail_timeout=15s; keepalive 16; }

# Qué backend corresponde a cada Host en el puerto 8000
map $host $tenant_upstream {
    default          "backend_1";
    t1.localhost     "backend_1";
    t2.localhost     "backend_2";
    t3.localhost     "backend_3";
}

map $host $tenant_name {
    default          "timeshift_1";
    t1.localhost     "timeshift_1";
    t2.localhost     "timeshift_2";
    t3.localhost     "timeshift_3";
}

# ── Acceso directo por puerto ─────────────────────────────────────────────────
server {
    listen 8001;
    client_max_body_size 25m;
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    location = /nginx-health { access_log off; return 200 "ok backend-1\n"; }

    location / {
        proxy_pass http://backend_1;
        include /etc/nginx/conf.d/proxy_common.inc;
        add_header X-TimeShift-Instance "backend-1" always;
        add_header X-TimeShift-Database "timeshift_1" always;
    }
}

server {
    listen 8002;
    client_max_body_size 25m;
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    location = /nginx-health { access_log off; return 200 "ok backend-2\n"; }

    location / {
        proxy_pass http://backend_2;
        include /etc/nginx/conf.d/proxy_common.inc;
        add_header X-TimeShift-Instance "backend-2" always;
        add_header X-TimeShift-Database "timeshift_2" always;
    }
}

server {
    listen 8003;
    client_max_body_size 25m;
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    location = /nginx-health { access_log off; return 200 "ok backend-3\n"; }

    location / {
        proxy_pass http://backend_3;
        include /etc/nginx/conf.d/proxy_common.inc;
        add_header X-TimeShift-Instance "backend-3" always;
        add_header X-TimeShift-Database "timeshift_3" always;
    }
}

# ── Puerta única enrutada por Host ────────────────────────────────────────────
server {
    listen 80 default_server;
    client_max_body_size 25m;
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        # $tenant_upstream sale del map de arriba según la cabecera Host
        proxy_pass http://$tenant_upstream;
        include /etc/nginx/conf.d/proxy_common.inc;
        add_header X-TimeShift-Database $tenant_name always;
    }
}
